name: Collect Bombers T7 regulations

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download T7 official regulations
        shell: bash
        run: |
          set -u
          mkdir -p t7
          : > t7/DOWNLOAD_REPORT.txt
          fetch() {
            local url="$1" out="$2"
            if curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' -o "t7/$out" "$url"; then
              if head -c 5 "t7/$out" | grep -q '%PDF-'; then
                printf 'OK  %s\n' "$out" >> t7/DOWNLOAD_REPORT.txt
              else
                printf 'NOT_PDF  %s\n' "$out" >> t7/DOWNLOAD_REPORT.txt
                rm -f "t7/$out"
              fi
            else
              printf 'FAILED  %s  %s\n' "$out" "$url" >> t7/DOWNLOAD_REPORT.txt
              rm -f "t7/$out"
            fi
          }
          fetch 'https://portaljuridic.gencat.cat/eli/es-ct/d/2016/07/19/276/dof/cat/pdf' 'Decret_276-2016_funcions_guardia_i_sistema_comandament.pdf'
          fetch 'https://portaljuridic.gencat.cat/eli/es-ct/d/2023/01/24/12/con/20260206/cat/pdf' 'Decret_12-2023_reestructuracio_versio_consolidada_2026-02-06.pdf'
          fetch 'https://dsp.interior.gencat.cat/bitstream/handle/20.500.14007/5968/Decret%2041_2024.pdf?isAllowed=y&sequence=1' 'Decret_41-2024_modificacio_Decret_12-2023.pdf'
          fetch 'https://dsp.interior.gencat.cat/bitstream/handle/20.500.14007/5979/Decret%20239_2025.pdf?isAllowed=y&sequence=1' 'Decret_239-2025_modificacio_Decret_12-2023.pdf'
          fetch 'https://dsp.interior.gencat.cat/bitstream/handle/20.500.14007/5979/Correcci%C3%B3%20d%27errades%20al%20Decret%20239_2025.pdf?isAllowed=y&sequence=5' 'Correccio_errades_Decret_239-2025.pdf'
          fetch 'https://governobert.gencat.cat/web/shared/Transparencia/normativa-en-tramit/INT/finalitzats/decrets/decret-16-2026/Publicacio-DOGC-Decret.pdf' 'Decret_16-2026_modificacio_Decret_12-2023.pdf'
          find t7 -type f -name '*.pdf' -print0 | sort -z | xargs -0 -r sha256sum > t7/SHA256SUMS.txt
          cat t7/DOWNLOAD_REPORT.txt
      - name: Upload T7 regulations
        uses: actions/upload-artifact@v4
        with:
          name: bombers-81-26-t7-regulations
          path: t7
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
