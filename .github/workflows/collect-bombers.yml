name: Collect Bombers supplemental documents

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install collector dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Download supplemental corpus
        run: python scripts/collect_bombers_supplement.py
      - name: Upload collected corpus
        uses: actions/upload-artifact@v4
        with:
          name: bombers-81-26-supplement
          path: supplement
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
