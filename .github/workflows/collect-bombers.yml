name: Collect Bombers study documents

on:
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install collector dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Download official corpus
        run: |
          set +e
          python scripts/collect_bombers.py
          code=$?
          echo "collector_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Upload collected corpus
        uses: actions/upload-artifact@v4
        with:
          name: bombers-81-26-official-corpus
          path: bundle
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
